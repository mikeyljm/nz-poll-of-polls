name: Scraper check

# Manual: fetch a Wikipedia polling page, run the scraper on it, and keep the raw HTML
# as an artifact so the parser can be tested against the real page.
on:
  workflow_dispatch:
    inputs:
      page:
        description: "Wikipedia page title"
        default: "Opinion polling for the 2026 New Zealand general election"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests beautifulsoup4 lxml html5lib
      - run: python pipeline/scrape_polls.py --page "${{ inputs.page }}" --out check/polls.csv --save-html check/page.html
      - uses: actions/upload-artifact@v4
        with:
          name: scraper-check
          path: check/
